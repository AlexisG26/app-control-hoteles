<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Control de Hoteles</title>
  <meta name="description" content="Recepción, limpieza y contabilidad de Hostal Prado Alto y ProKinto.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hoteles">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>try{var t=localStorage.getItem('ch-theme');if(t&&t!=='"auto"'){t=JSON.parse(t);if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="wrap" aria-live="polite"><p class="hint">Cargando…</p></div>
  <div id="sheetHost"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
