name: Diagnóstico (historial)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preparar wrangler.toml
        working-directory: worker
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: sed -i -E "s|database_id = \"[^\"]*\"|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
      - name: Exportar copia de la base (sin imprimir nada)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 export control-hoteles --remote --output=/tmp/copia.sql > /dev/null 2>&1 && echo "copia lista"
      - name: Probar historial con datos reales (API)
        run: node --experimental-sqlite scripts/diagnostico-historial.mjs /tmp/copia.sql
      - name: Probar la pantalla con datos reales (iPhone/Safari y Chrome)
        run: |
          pip install -q playwright > /dev/null 2>&1
          python -m playwright install --with-deps webkit chromium > /dev/null 2>&1
          node --experimental-sqlite scripts/diag-ui-server.mjs /tmp/copia.sql &
          sleep 3
          python scripts/diag-ui.py
      - run: rm -f /tmp/copia.sql /tmp/diag-token
        if: always()
