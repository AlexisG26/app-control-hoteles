# Control de Hoteles · configuración del Worker de Cloudflare
name = "control-hoteles-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Revisión automática cada 5 minutos: salidas automáticas, avisos y órdenes de compra.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "control-hoteles"
# Id de la base D1 "control-hoteles" en Cloudflare
database_id = "feea2b90-12b7-4211-bf6c-042650d0b87b"
migrations_dir = "migrations"

# Fotos de problemas en habitaciones (R2). D1 guarda la referencia a cada foto.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "control-hoteles-fotos"

[vars]
APP_NAME = "Control de Hoteles"
# Dirección de tu PWA en GitHub Pages (sin barra final). Puedes poner varias separadas por coma.
ALLOWED_ORIGIN = "https://TU-USUARIO.github.io"
# Dominio para la huella / Face ID: el mismo dominio de GitHub Pages.
RP_ID = "TU-USUARIO.github.io"
# Zona horaria de Honduras (UTC-6, sin horario de verano).
TZ_OFFSET_MIN = "-360"
PO_REMINDER_TIME = "08:00"
OWNER_NAME = "Alexis Gutiérrez"
VAPID_SUBJECT = "mailto:TU-CORREO@ejemplo.com"
# VAPID_PUBLIC_KEY se carga como variable; ver docs/PUESTA-EN-MARCHA.md

# Secretos (los carga GitHub Actions en cada publicación; nunca van aquí):
#   OWNER_EMAIL, AUTH_PEPPER, RESEND_API_KEY, MAIL_FROM, VAPID_PRIVATE_JWK, VAPID_PUBLIC_KEY, TELEGRAM_BOT_TOKEN (opcional)
